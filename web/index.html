<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>REALITY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#07080b; --deep:#0d0f14; --line:#1b1f27;
    --ink:#e9e7e2; --dim:#7c8191; --faint:#464c59;
    --me:#d8b26a;      /* your shadow  */
    --them:#6f93b8;    /* theirs       */
    --hot:#c4645c;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;background:var(--void);color:var(--ink);
    font:15px/1.55 "IBM Plex Mono",ui-monospace,Menlo,monospace;
    display:flex;align-items:center;justify-content:center;padding:28px 18px;
  }
  .app{width:min(760px,100%);display:flex;flex-direction:column;gap:26px}

  /* ---------- masthead ---------- */
  .mast{text-align:center;display:flex;flex-direction:column;gap:9px}
  h1{
    font-family:Fraunces,Georgia,serif;font-weight:300;font-size:clamp(34px,8vw,54px);
    letter-spacing:.3em;margin:0;text-indent:.3em;
  }
  .creed{color:var(--dim);font-size:12.5px;letter-spacing:.06em}
  .creed b{color:var(--ink);font-weight:500}

  /* ---------- the shadow: the hero ---------- */
  .stage{
    background:var(--deep);border:1px solid var(--line);border-radius:3px;
    padding:30px 26px 24px;display:flex;flex-direction:column;gap:20px;
  }
  .stage-head{display:flex;justify-content:space-between;align-items:baseline;
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
  .stage-head .axis{color:var(--me)}

  .bar{position:relative;height:74px}
  .bar svg{display:block;width:100%;height:100%;overflow:visible}
  .reading{
    font-family:Fraunces,Georgia,serif;font-size:40px;font-weight:300;
    text-align:center;color:var(--me);font-variant-numeric:tabular-nums;
    letter-spacing:.02em;min-height:52px;
  }
  .reading.void{color:var(--faint);font-size:15px;font-family:"IBM Plex Mono",monospace;
    letter-spacing:.14em;text-transform:uppercase;padding-top:18px}

  .trail{height:46px}
  .trail svg{display:block;width:100%;height:100%;overflow:visible}
  .trail-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--faint);text-align:center;margin-top:-4px}

  /* ---------- controls ---------- */
  .acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}
  button{
    font:inherit;font-size:13px;letter-spacing:.04em;cursor:pointer;
    background:transparent;border:1px solid var(--line);color:var(--dim);
    border-radius:2px;padding:13px 10px;transition:border-color .16s,color .16s;
  }
  button:hover:not(:disabled),button:focus-visible:not(:disabled){
    color:var(--ink);border-color:var(--faint);outline:none}
  button:disabled{opacity:.28;cursor:not-allowed}
  button.key{border-color:#3a3020;color:var(--me)}
  button.key:hover:not(:disabled){border-color:var(--me)}
  button.danger{border-color:#3d2624;color:var(--hot)}
  button.danger:hover:not(:disabled){border-color:var(--hot)}
  button.on{background:#15181f;color:var(--ink);border-color:var(--faint)}

  .verdict{display:flex;flex-direction:column;gap:9px;
    border-top:1px solid var(--line);padding-top:18px}
  .verdict-label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
  .laws{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}
  .laws button{text-align:left;padding:11px 13px;line-height:1.35}
  .laws .name{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
  .laws .desc{display:block;font-size:11px;color:var(--faint);margin-top:3px}

  /* ---------- the other observer ---------- */
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:3px;overflow:hidden}
  .seat{background:var(--deep);padding:15px 17px;display:flex;flex-direction:column;gap:5px}
  .seat .who{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
  .seat.mine .who{color:var(--me)} .seat.theirs .who{color:var(--them)}
  .seat .score{font-family:Fraunces,Georgia,serif;font-size:26px;font-weight:300;
    font-variant-numeric:tabular-nums}
  .seat .note{font-size:11px;color:var(--dim);min-height:16px}

  .log{font-size:11.5px;color:var(--faint);display:flex;flex-direction:column;gap:3px;
    min-height:70px}
  .log div:last-child{color:var(--dim)}

  /* ---------- end ---------- */
  .curtain{
    border:1px solid var(--line);border-radius:3px;background:var(--deep);
    padding:26px;text-align:center;display:flex;flex-direction:column;gap:11px}
  .curtain .verdict-line{font-family:Fraunces,Georgia,serif;font-size:27px;font-weight:300}
  .curtain .truth{font-size:12.5px;color:var(--dim);letter-spacing:.05em}
  .hidden{display:none!important}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  @media (max-width:520px){.pair{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">

  <div class="mast">
    <h1>REALITY</h1>
    <div class="creed">
      Two observers. One universe. One law.<br>
      You see only a <b>shadow</b>. Turning forward and turning back cast the same one.
    </div>
  </div>

  <div class="stage">
    <div class="stage-head">
      <span>your axis · <span class="axis" id="axis">—</span></span>
      <span id="clock">step 0</span>
    </div>

    <div class="reading void" id="reading">nothing observed</div>

    <div class="bar">
      <svg viewBox="0 0 100 26" preserveAspectRatio="none" aria-hidden="true">
        <line x1="0" y1="13" x2="100" y2="13" stroke="#1b1f27" stroke-width=".4"/>
        <line x1="50" y1="8" x2="50" y2="18" stroke="#1b1f27" stroke-width=".4"/>
        <line x1="0" y1="9" x2="0" y2="17" stroke="#1b1f27" stroke-width=".4"/>
        <line x1="100" y1="9" x2="100" y2="17" stroke="#1b1f27" stroke-width=".4"/>
        <g id="ghosts"></g>
        <circle id="mark" cx="50" cy="13" r="1.6" fill="#d8b26a" opacity="0"/>
      </svg>
    </div>

    <div>
      <div class="trail"><svg id="trail" viewBox="0 0 100 40" preserveAspectRatio="none"></svg></div>
      <div class="trail-label" id="trail-label">your readings</div>
    </div>

    <div class="acts">
      <button id="btn-observe" class="key">Observe</button>
      <button id="btn-advance">Turn the universe</button>
      <button id="btn-trade">Offer a trade</button>
    </div>

    <div class="verdict">
      <div class="verdict-label">Name the law — right ends it, wrong ends you</div>
      <div class="laws" id="laws"></div>
      <button id="btn-lock" class="danger" disabled>Lock it in</button>
    </div>
  </div>

  <div class="pair">
    <div class="seat mine">
      <span class="who">You · <span id="me-id">—</span></span>
      <span class="score" id="me-score">0</span>
      <span class="note" id="me-note"></span>
    </div>
    <div class="seat theirs">
      <span class="who">Them · <span id="them-id">—</span></span>
      <span class="score" id="them-score">0</span>
      <span class="note" id="them-note">waiting for a second observer</span>
    </div>
  </div>

  <div class="log" id="log"></div>

  <div class="curtain hidden" id="curtain">
    <div class="verdict-line" id="curtain-line"></div>
    <div class="truth" id="curtain-truth"></div>
    <button onclick="location.reload()">Again</button>
  </div>
</div>

<script>
const room = location.hash.slice(1) || "one";
const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws/${room}`);
const $ = id => document.getElementById(id);

let ME = null, PICK = null, STATE = null;

const LAW_NAMES = {
  spin_forward: "Forward",
  spin_backward: "Backward",
  frozen: "Frozen"
};

ws.onmessage = ev => {
  const msg = JSON.parse(ev.data);
  if (msg.type === "error") { $("log").textContent = msg.error.replace(/_/g, " "); return; }
  if (msg.type === "joined") {
    ME = msg.player_id;
    $("me-id").textContent = ME;
    $("them-id").textContent = ME === "A" ? "B" : "A";
    $("axis").textContent = msg.axis + "θ";
    buildLaws(msg.state.laws);
  }
  if (msg.state) render(msg.state);
};
ws.onclose = () => { $("log").textContent = "connection closed"; };

const send = (action, extra = {}) => ws.send(JSON.stringify({ action, ...extra }));
$("btn-observe").onclick = () => send("observe");
$("btn-advance").onclick = () => send("advance");
$("btn-trade").onclick    = () => send("trade");
$("btn-lock").onclick     = () => { if (PICK) send("lock"); };

function buildLaws(laws) {
  const box = $("laws"); box.innerHTML = "";
  for (const law of laws) {
    const b = document.createElement("button");
    b.innerHTML = `<span class="name">${LAW_NAMES[law.id] || law.id}</span>`
                + `<span class="desc">${law.description}</span>`;
    b.onclick = () => {
      PICK = law.id;
      [...box.children].forEach(c => c.classList.toggle("on", c === b));
      $("btn-lock").disabled = false;
      send("hypothesize", { law: law.id });
    };
    box.appendChild(b);
  }
}

function render(s) {
  STATE = s;
  const them = ME === "A" ? "B" : "A";
  const me = s.players[ME] || {}, they = s.players[them] || {};
  const readings = me.readings || [];
  const mine = readings.filter(r => r.source === "self");
  const given = readings.filter(r => r.source !== "self");

  $("clock").textContent = `step ${s.step} / ${s.max_steps}`;
  $("me-score").textContent = me.score ?? 0;
  $("them-score").textContent = they.score ?? 0;

  // current reading, big
  const latest = mine[mine.length - 1];
  const el = $("reading");
  if (latest) {
    el.classList.remove("void");
    el.textContent = latest.value > 0 ? `+${latest.value.toFixed(4)}` : latest.value.toFixed(4);
  } else {
    el.classList.add("void");
    el.textContent = "nothing observed";
  }

  // shadow on the axis: -1 .. +1 mapped to 0 .. 100
  const mark = $("mark"), ghosts = $("ghosts");
  ghosts.innerHTML = "";
  mine.slice(-7, -1).forEach((r, i, a) => {
    const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    c.setAttribute("cx", (r.value + 1) * 50);
    c.setAttribute("cy", 13);
    c.setAttribute("r", 1.1);
    c.setAttribute("fill", "#d8b26a");
    c.setAttribute("opacity", 0.06 + 0.07 * i / Math.max(a.length - 1, 1));
    ghosts.appendChild(c);
  });
  if (latest) {
    mark.setAttribute("cx", (latest.value + 1) * 50);
    mark.setAttribute("opacity", 1);
  }

  drawTrail(mine, given);
  $("trail-label").textContent = given.length
    ? `your readings · ${given.length} traded from ${them}`
    : "your readings";

  // seats
  $("me-note").textContent = me.locked ? "locked — you are out" : `${mine.length} observed`;
  $("them-note").textContent = they.locked
    ? "locked — they are out"
    : they.trade_offer
      ? "offering a trade"
      : `${they.reading_count ?? 0} observed · what they saw is hidden`;

  $("log").innerHTML = (s.log || []).map(line => `<div>${line}</div>`).join("");

  const dead = s.finished || me.locked;
  ["btn-observe", "btn-advance", "btn-trade"].forEach(id => $(id).disabled = dead);
  $("btn-lock").disabled = dead || !PICK;
  $("btn-trade").classList.toggle("on", Boolean(me.trade_offer));
  if (me.trade_offer) $("btn-trade").textContent = "trade offered";

  if (s.finished) curtain(s);
}

function drawTrail(mine, given) {
  const svg = $("trail");
  svg.innerHTML = "";
  const all = [...mine, ...given].sort((a, b) => a.step - b.step);
  if (!all.length) return;

  const span = Math.max(...all.map(r => r.step), 1);
  const pt = r => [ (r.step / span) * 100, 20 - r.value * 17 ];

  const mid = document.createElementNS("http://www.w3.org/2000/svg", "line");
  Object.entries({ x1:0, y1:20, x2:100, y2:20, stroke:"#1b1f27", "stroke-width":".3" })
    .forEach(([k, v]) => mid.setAttribute(k, v));
  svg.appendChild(mid);

  if (mine.length > 1) {
    const path = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
    path.setAttribute("points", mine.map(r => pt(r).join(",")).join(" "));
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", "#d8b26a");
    path.setAttribute("stroke-width", ".7");
    path.setAttribute("opacity", ".75");
    svg.appendChild(path);
  }
  for (const r of all) {
    const [cx, cy] = pt(r);
    const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    c.setAttribute("cx", cx); c.setAttribute("cy", cy); c.setAttribute("r", 1.3);
    c.setAttribute("fill", r.source === "self" ? "#d8b26a" : "#6f93b8");
    svg.appendChild(c);
  }
}

function curtain(s) {
  const me = s.players[ME] || {};
  $("curtain").classList.remove("hidden");
  $("curtain-line").textContent =
    s.winner === ME ? "You named it."
    : s.winner ? "They named it first."
    : me.locked ? "Both of you were wrong."
    : "The universe ran down.";
  $("curtain-truth").textContent =
    `The law was ${LAW_NAMES[s.law] || s.law}. Your score: ${me.score ?? 0}.`;
}
</script>
</body>
</html>
